name: .NET Multi-Mod Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build Projects for Artifacts
      run: |
        # Find all project files
        PROJECTS=$(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*")

        for proj in $PROJECTS; do
          echo "=========================================="
          echo "Building: $proj"
          echo "=========================================="
          
          # 1. Restore
          dotnet restore "$proj"
          
          # 2. Build DLL only
          # We use -p:IgnoreModDeploy=true to prevent it from looking for the Game folder
          dotnet build "$proj" -c Release --no-restore \
            -p:IgnoreModDeploy=true \
            -p:IgnoreModPack=true \
            -p:GamePath="/tmp"
        done

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Mod-DLLs
        path: |
          **/bin/Release/**/*.dll
          **/bin/Release/**/*.json
