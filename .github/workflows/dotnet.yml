name: .NET Multi-Mod Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build Projects for Artifacts
      run: |
        # 1. Create a fake 'Stardew Valley' file to trick the build check
        # The build package just checks if the file exists, not what's in it.
        touch "Stardew Valley"

        PROJECTS=$(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*")

        for proj in $PROJECTS; do
          echo "=========================================="
          echo "Building: $proj"
          echo "=========================================="
          
          dotnet restore "$proj"
          
          # 2. Point GamePath to the current folder where we created the fake file
          dotnet build "$proj" -c Release --no-restore \
            -p:GamePath="$GITHUB_WORKSPACE" \
            -p:IgnoreModDeploy=true
        done

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Mod-DLLs
        path: "**/bin/Release/**"
