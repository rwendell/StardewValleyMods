name: .NET Multi-Mod Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore, Build, and Test all Mods
      run: |
        # Find all .csproj files, excluding the obj and bin folders
        PROJECTS=$(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*")

        for proj in $PROJECTS; do
          # Get the folder containing the project file
          MOD_DIR=$(dirname "$proj")
          
          echo "=========================================="
          echo "Building Project: $proj"
          echo "Directory: $MOD_DIR"
          echo "=========================================="
          
          # 1. Enter the mod folder
          cd "$GITHUB_WORKSPACE/$MOD_DIR"
          
          # 2. Perform the lifecycle
          dotnet restore
          dotnet build -c Release --no-restore
          dotnet test --no-build --verbosity normal
          
          # 3. Return to the root to find the next mod
          cd "$GITHUB_WORKSPACE"
        doneal
          
          # Return to the root directory for the next iteration
          cd $GITHUB_WORKSPACE
        done
