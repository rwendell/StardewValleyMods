name: .NET Multi-Mod Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore, Build, and Test all Mods
      run: |
        # Find directories containing a .csproj file
        for proj in $(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*"); do
          # Get the directory containing the csproj
          MOD_DIR=$(dirname "$proj")
          
          echo "=========================================="
          echo "Processing: $MOD_DIR"
          echo "=========================================="
          
          # Move into the directory so dotnet find the context correctly
          cd "$GITHUB_WORKSPACE/$MOD_DIR"
          
          dotnet restore
          dotnet build -c Release --no-restore
          dotnet test --no-build --verbosity normal
          
          # Return to the root directory for the next iteration
          cd $GITHUB_WORKSPACE
        done
