name: .NET Multi-Mod Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build Projects for Artifacts
      run: |
        # 1. Create a dummy game directory with the 1.6+ marker
        mkdir -p /tmp/fake_game
        touch "/tmp/fake_game/StardewValley.dll"

        # 2. Find and build each project
        PROJECTS=$(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*")

        for proj in $PROJECTS; do
          echo "=========================================="
          echo "Building: $proj"
          echo "=========================================="
          
          dotnet restore "$proj"
          
          # We use GamePath to satisfy the check and IgnoreModDeploy to skip installation
          dotnet build "$proj" -c Release --no-restore \
            -p:GamePath="/tmp/fake_game" \
            -p:IgnoreModDeploy=true \
            -p:EnableModZip=false
        done

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Mod-DLLs
        path: |
          **/bin/Release/**/*.dll
          **/bin/Release/**/manifest.json
