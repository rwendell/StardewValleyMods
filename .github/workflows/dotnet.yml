name: .NET Multi-Mod Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore, Build, and Test all Projects
      run: |
        # 1. Find all project files
        # We exclude bin/obj folders to avoid picking up temp files
        PROJECTS=$(find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*")

        for proj in $PROJECTS; do
          echo "=========================================="
          echo "Processing Project: $proj"
          echo "=========================================="
          
          # 2. Restore specifically for this project file
          dotnet restore "$proj"
          
          # 3. Build specifically for this project file
          # Adding -p:GamePath is a common fix for Stardew Mods in CI
          dotnet build "$proj" -c Release --no-restore -p:GamePath="/tmp"
          
          # 4. Test specifically for this project file
          # We check if there are tests; if not, this will just skip gracefully
          dotnet test "$proj" --no-build --verbosity normal || echo "No tests found or tests failed for $proj"
        done
